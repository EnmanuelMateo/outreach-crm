# Render Blueprint — GitHub → auto-deploy for the Outreach CRM.
# On first deploy: New > Blueprint, point at this repo. Render reads this file.
# Set DATABASE_URL manually in the dashboard (from your Supabase connection string);
# it's marked sync:false so the secret is never committed to git.
services:
  - type: web
    name: outreach-crm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
