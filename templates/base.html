<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201f1d">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Outreach · CRM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('dashboard') }}">Outreach<span class="dot"> · </span>CRM</a>
      <nav class="topnav">
        <a href="{{ url_for('dashboard') }}" class="{{ 'on' if active=='dashboard' }}">Panel</a>
        <a href="{{ url_for('companies') }}" class="{{ 'on' if active in ['companies','new'] }}">Empresas</a>
        <a href="{{ url_for('settings') }}" class="{{ 'on' if active=='settings' }}">Ajustes</a>
      </nav>
      <a class="nav-new" href="{{ url_for('company_new') }}">+ Nueva empresa</a>
    </div>
  </header>

  <main class="wrap {% block wrapclass %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {# Persistent quick-add — one tap from anywhere (mobile) #}
  <a class="fab" href="{{ url_for('company_new') }}" aria-label="Añadir empresa" title="Añadir empresa">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </a>
</body>
</html>
